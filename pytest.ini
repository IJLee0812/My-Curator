[pytest]
minversion = 8.0
addopts = -ra --strict-markers --strict-config --cov=my_curator
          --cov-report=term-missing:skip-covered --cov-report=xml:coverage.xml
          -p no:cacheprovider
testpaths = tests
markers =
    unit: fast pure-python tests (<100ms). No deps.
    integration: testcontainers-based (docker required, <10s/test).
    e2e: full stack. DeepStream container required.
    schema: JSON Schema validation (Scenario DNA). Runs alongside unit.
    performance: latency/throughput regression. GPU required.
    simulation: CARLA-based scenario replay. gpu1 + carla container.
    gpu: GPU required (GPU CI runner only).
    slow: >3 min (nightly only).
    prompt_regression: prompt-change DNA-quality regression. Gold set required.
    gstreamer: GStreamer runtime required (Docker only).
asyncio_mode = auto
xfail_strict = true
filterwarnings =
    error
    ignore::DeprecationWarning:pkg_resources.*
    ignore::UserWarning:torch.*
    ignore::DeprecationWarning:importlib.*
    ignore::PendingDeprecationWarning
    # Pre-existing asyncio-3.10 wart: a stray event loop leaked at import time is GC'd
    # nondeterministically and, under `error`, its unraisable ResourceWarning fails whatever
    # (unrelated, usually GStreamer OSD) test is running. Ignore ONLY these two GC-noise
    # warnings — not ResourceWarning broadly — so real leaks still surface as errors.
    ignore:unclosed event loop:ResourceWarning
    ignore:unclosed <socket:ResourceWarning
