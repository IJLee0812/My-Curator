[pytest]
minversion = 8.0
addopts = -ra --strict-markers --strict-config --cov=my_curator --cov=src
          --cov-report=term-missing:skip-covered --cov-report=xml:coverage.xml
          -p no:cacheprovider
testpaths = tests
markers =
    unit: fast pure-python tests (<100ms). No deps.
    integration: testcontainers-based (docker required, <10s/test).
    e2e: full stack. DeepStream container required.
    schema: JSON Schema validation (Scenario DNA). Runs alongside unit.
    performance: latency/throughput regression. GPU required.
    simulation: CARLA-based scenario replay. gpu1 + carla container.
    gpu: GPU required (GPU CI runner only).
    slow: >3 min (nightly only).
    prompt_regression: prompt-change DNA-quality regression. Gold set required.
    gstreamer: GStreamer runtime required (Docker only).
asyncio_mode = auto
xfail_strict = true
filterwarnings =
    error
    ignore::DeprecationWarning:pkg_resources.*
    ignore::UserWarning:torch.*
    ignore::DeprecationWarning:importlib.*
    ignore::PendingDeprecationWarning
    ignore:src\.scouts is moving to my_curator:DeprecationWarning
    ignore:src\.streaming is moving to my_curator:DeprecationWarning
    ignore:src\.storage is moving to my_curator:DeprecationWarning
    ignore:src\.bus is moving to my_curator:DeprecationWarning
    ignore:plugin is moving to my_curator:DeprecationWarning
    ignore:probes is moving to my_curator:DeprecationWarning
    ignore:services\.curation_api is moving to my_curator:DeprecationWarning
    ignore:services\.embedder is moving to my_curator:DeprecationWarning
