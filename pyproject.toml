[project]
name = "my-curator"
version = "0.5.0"
description = "DeepStream 9.0 + Cosmos-Reason2-8B FP8 driving-clip curation platform"
requires-python = ">=3.10"
# Runtime deps managed by Dockerfile + requirements.txt (not here,
# because vllm/torch require CUDA which is unavailable on host).

[project.scripts]
my-curator-pipeline = "my_curator.cli.run_pipeline:main"
my-curator-consumer = "my_curator.cli.run_curation_consumer:main"
my-curator-embedder = "my_curator.cli.run_embedder:main"
my-curator-kafka-tail = "my_curator.cli.dev_kafka_tail:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["my_curator*"]
namespaces = false

[project.optional-dependencies]
test = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-mock>=3.15",
    "PyYAML>=6.0",
    "jsonschema>=4.0",
    "asyncpg==0.31.0",
    "pytest-asyncio==1.3.0",
    "testcontainers[postgres]==4.14.2",
    "pymilvus==2.6.12",
    "boto3==1.42.96",
    "hypothesis==6.152.3",
]
lint = [
    "ruff>=0.15",
]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-mock>=3.15",
    "PyYAML>=6.0",
    "jsonschema>=4.0",
    "asyncpg==0.31.0",
    "pytest-asyncio==1.3.0",
    "testcontainers[postgres]==4.14.2",
    "pymilvus==2.6.12",
    "boto3==1.42.96",
    "hypothesis==6.152.3",
    "ruff>=0.15",
]


[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "reference/",
    "models/",
    ".venv/",
    "results/",
    "logs/",
    "docs/",
    "services/ui/",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E501",    # line length handled by formatter
    "E402",    # module-level import not at top (GStreamer gi.require_version pattern)
    "F401",    # unused import (gstnvvllmvlm imported for side-effect registration)
    "SIM102",  # nested if — GStreamer pad callbacks are clearer expanded
    "SIM105",  # contextlib.suppress — try/except/pass is more explicit for CUDA/GStreamer
    "SIM108",  # ternary — multi-line if/else is clearer for nanosecond math
    "UP035",   # typing.Dict/List deprecated — keep for compatibility with older type checkers
]

[tool.ruff.lint.per-file-ignores]
"my_curator/adapters/gst/nvvllmvlm.py" = ["E402", "B007"]
"my_curator/interfaces/http/curation_api/*.py" = ["B008"]
"my_curator/interfaces/http/curation_api/routers/*.py" = ["B008"]
"scripts/*" = ["E402", "B007"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
