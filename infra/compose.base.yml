# Storage tri-stack for My-Curator (P1-2 baseline).
#
# Services:
#   minio      — S3-compatible object store (blobs: raw/, clips/, frames/, artifacts/, milvus/)
#   minio-init — one-shot sidecar that creates the 5 buckets on first boot
#   postgres   — structured metadata (sessions, clips, scenario_dna, review_queue)
#   milvus-etcd — metadata store used internally by Milvus
#   milvus     — vector DB (GPU_CAGRA on GPU 1)
#
# Version pinning rationale: see docs/runbooks/storage_compose.md
#
# Bring up:     docker compose -f infra/compose.base.yml --env-file .env up -d
# Tear down:    docker compose -f infra/compose.base.yml --env-file .env down -v
# Health check: docker compose -f infra/compose.base.yml ps

name: my-curator-base

networks:
  curation-net:
    driver: bridge

services:

  # ──────────────────────────────────────────────────────────────────────
  # MinIO — S3-compatible object store (~20 GB local cache budget)
  # ──────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: my-curator-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD}"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - "${DATA_ROOT}/minio:/data"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -f http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - curation-net

  # ──────────────────────────────────────────────────────────────────────
  # MinIO init — auto-create 5 buckets on first boot, then exit
  # ──────────────────────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: my-curator-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_USER} $${MINIO_PASSWORD};
        for b in raw clips frames artifacts milvus; do
          mc mb --ignore-existing local/$$b;
        done;
        mc ls local;
        echo 'buckets ready';
      "
    environment:
      MINIO_USER: "${MINIO_USER}"
      MINIO_PASSWORD: "${MINIO_PASSWORD}"
    restart: "no"
    networks:
      - curation-net

  # ──────────────────────────────────────────────────────────────────────
  # PostgreSQL — system of record
  # ──────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17.9-alpine3.23
    container_name: my-curator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${PG_USER}"
      POSTGRES_PASSWORD: "${PG_PASSWORD}"
      POSTGRES_DB: curation
    ports:
      - "5432:5432"
    volumes:
      - "${DATA_ROOT}/pg:/var/lib/postgresql/data"
      - "./init-sql:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d curation"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - curation-net

  # ──────────────────────────────────────────────────────────────────────
  # etcd — Milvus metadata catalog
  # ──────────────────────────────────────────────────────────────────────
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: my-curator-milvus-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - -advertise-client-urls=http://milvus-etcd:2379
      - -listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - "${DATA_ROOT}/etcd:/etcd"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - curation-net

  # ──────────────────────────────────────────────────────────────────────
  # Milvus — GPU standalone (pinned to GPU 0)
  # ──────────────────────────────────────────────────────────────────────
  milvus:
    image: milvusdb/milvus:v2.6.15-gpu
    container_name: my-curator-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: "${MINIO_USER}"
      MINIO_SECRET_ACCESS_KEY: "${MINIO_PASSWORD}"
      MINIO_BUCKET_NAME: milvus
    depends_on:
      milvus-etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "19530:19530"   # gRPC
      - "9091:9091"     # metrics / health
    volumes:
      - "${DATA_ROOT}/milvus:/var/lib/milvus"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    networks:
      - curation-net
