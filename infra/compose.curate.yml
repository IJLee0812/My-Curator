# Curation integration stack for My-Curator (P2-4+).
#
# Includes: Postgres + MinIO + Milvus (via compose.base.yml) + Kafka broker.
# Use this file for integration tests and standalone curation pipeline runs
# (without the full DeepStream container from docker-compose.yml).
#
# Bring up:     docker compose -f infra/compose.base.yml -f infra/compose.curate.yml --env-file .env up -d
# Tear down:    docker compose -f infra/compose.base.yml -f infra/compose.curate.yml --env-file .env down -v
#
# Note: docker-compose.yml (DS pipeline) also contains a Kafka broker on port 9092.
# Do not run both stacks simultaneously — port 9092 will conflict.

services:

  # ──────────────────────────────────────────────────────────────────────
  # Zookeeper — Kafka metadata store
  # ──────────────────────────────────────────────────────────────────────
  curator-zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: curator-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - curation-net

  # ──────────────────────────────────────────────────────────────────────
  # Kafka broker — curation event bus
  # Topics auto-created on first publish:
  #   curation.clip.scouted       — grounded clips → DNA pipeline
  #   curation.clip.needs_review  — partial / zero-grounding → manual review
  # ──────────────────────────────────────────────────────────────────────
  curator-kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: curator-kafka
    restart: unless-stopped
    depends_on:
      curator-zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: curator-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s
    networks:
      - curation-net

networks:
  curation-net:
    external: true
    name: my-curator-base_curation-net
