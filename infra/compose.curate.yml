# Curation integration stack for My-Curator (P2-4+).
#
# Includes: Postgres + MinIO + Milvus (via compose.base.yml) + Kafka broker.
# Use this file for integration tests and standalone curation pipeline runs
# (without the full DeepStream container from docker-compose.yml).
#
# Bring up:     docker compose -f infra/compose.base.yml -f infra/compose.curate.yml --env-file .env up -d
# Tear down:    docker compose -f infra/compose.base.yml -f infra/compose.curate.yml --env-file .env down -v
#
# DS pipeline: infra/compose.pipeline.yml — uses network_mode: host → connects to
# this Kafka via localhost:9092.  Do NOT bring up compose.pipeline.yml before
# my-curator-kafka is healthy.

services:

  # ──────────────────────────────────────────────────────────────────────
  # Zookeeper — Kafka metadata store
  # ──────────────────────────────────────────────────────────────────────
  my-curator-zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: my-curator-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=*"
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - curation-net

  # ──────────────────────────────────────────────────────────────────────
  # Kafka broker — curation event bus
  # Topics auto-created on first publish:
  #   curation.clip.scouted       — grounded clips → DNA pipeline
  #   curation.clip.needs_review  — partial / zero-grounding → manual review
  # ──────────────────────────────────────────────────────────────────────
  my-curator-kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: my-curator-kafka
    restart: unless-stopped
    depends_on:
      my-curator-zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: my-curator-zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,DOCKER://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://my-curator-kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s
    networks:
      - curation-net

  # ──────────────────────────────────────────────────────────────────────
  # curation-api — FastAPI hybrid search service (P3-2)
  # Port: 8001.  GPU 0 via device_ids: ["0"] + CUDA_VISIBLE_DEVICES=0.
  # /health returns 200 only after Cosmos-Embed1 text tower is warmed up.
  # ──────────────────────────────────────────────────────────────────────
  curation-api:
    build:
      context: ..
      dockerfile: infra/curation_api.Dockerfile
    container_name: curation-api
    restart: unless-stopped
    depends_on:
      milvus:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      CUDA_VISIBLE_DEVICES: "0"
      MILVUS_URI: "http://my-curator-milvus:19530"
      MINIO_ENDPOINT: "http://my-curator-minio:9000"
      MINIO_USER: "${MINIO_USER}"
      MINIO_PASSWORD: "${MINIO_PASSWORD}"
      PG_USER: "${PG_USER}"
      PG_PASSWORD: "${PG_PASSWORD}"
      PG_HOST: "my-curator-postgres"
      PG_PORT: "5432"
      PG_DB: "curation"
      KAFKA_BOOTSTRAP_SERVERS: "my-curator-kafka:29092"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}"
      # Set VIDEO_DATA_ROOT in .env (gitignored) to the real NAS/dataset root.
      # Falls back to /tmp when unset so compose doesn't error out on machines
      # without the NAS mount (thumbnail / stream endpoints return 404 in that case).
      VIDEO_DATA_ROOT: "${VIDEO_DATA_ROOT:-/tmp}"
    volumes:
      - "${REPO_ROOT:-..}/models:/app/models:ro"
      - "${VIDEO_DATA_ROOT:-/tmp}:${VIDEO_DATA_ROOT:-/tmp}:ro"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    networks:
      - curation-net

  # ──────────────────────────────────────────────────────────────────────
  # embedder-worker — Kafka → Cosmos-Embed1 video tower → Milvus upsert (P3-1, P3-2)
  # Subscribes to curation.clip.scouted; downloads 8 JPEG frames from MinIO
  # for clips with frames_blob_uri set (DS pipeline format only — /v1/ingest
  # messages are skipped because they have no frames key).  Replaces the
  # zero-vector stub written by CurationConsumer with the real 768-dim
  # video embedding so DS pipeline clips become searchable via /v1/search.
  # GPU 0 (shared with curation-api: same Cosmos-Embed1-336p weights, two towers).
  # ──────────────────────────────────────────────────────────────────────
  embedder-worker:
    build:
      context: ..
      dockerfile: infra/curation_api.Dockerfile
    container_name: my-curator-embedder
    restart: unless-stopped
    depends_on:
      my-curator-kafka:
        condition: service_healthy
      milvus:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      CUDA_VISIBLE_DEVICES: "0"
      KAFKA_BROKER: "my-curator-kafka:29092"
      MILVUS_URI: "http://my-curator-milvus:19530"
      MINIO_ENDPOINT: "http://my-curator-minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_USER}"
      MINIO_SECRET_KEY: "${MINIO_PASSWORD}"
    volumes:
      - "${REPO_ROOT:-..}/models:/app/models:ro"
    command:
      - "python3"
      - "-m"
      - "my_curator.cli.run_embedder"
      - "--timeout"
      - "0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    networks:
      - curation-net

  # ──────────────────────────────────────────────────────────────────────
  # ui — Next.js 16 curation console (P3-4)
  # Port 3000 (host).  Browser-side fetches hit curation-api via
  # NEXT_PUBLIC_API_BASE (localhost:8001 from the user's machine);
  # Server Components fetch via INTERNAL_API_BASE on the docker network.
  # ──────────────────────────────────────────────────────────────────────
  ui:
    build:
      context: ../services/ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ""
    container_name: my-curator-ui
    restart: unless-stopped
    depends_on:
      curation-api:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: ""
      INTERNAL_API_BASE: "http://curation-api:8001"
      NODE_ENV: "production"
    networks:
      - curation-net

  # ──────────────────────────────────────────────────────────────────────
  # curation-consumer — Kafka → Postgres + Milvus bridge (P2-4, P3-2)
  # Handles both DS pipeline format and /v1/ingest format messages.
  # Runs indefinitely (--timeout 0); restarts automatically.
  # ──────────────────────────────────────────────────────────────────────
  curation-consumer:
    build:
      context: ..
      dockerfile: infra/curation_api.Dockerfile
    container_name: my-curator-consumer
    restart: unless-stopped
    depends_on:
      my-curator-kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
    environment:
      SESSION_ID: "curation-daemon"
      CURATOR_DATASET: "curation"
      CURATOR_SUBSET: "api"
      CURATOR_DATASET_VERSION: "0"
      PG_USER: "${PG_USER}"
      PG_PASSWORD: "${PG_PASSWORD}"
      PG_HOST: "my-curator-postgres"
      PG_PORT: "5432"
      PG_DB: "curation"
      KAFKA_BROKER: "my-curator-kafka:29092"
      VIDEO_DATA_ROOT: "${VIDEO_DATA_ROOT:-/tmp}"
    volumes:
      - "${VIDEO_DATA_ROOT:-/tmp}:${VIDEO_DATA_ROOT:-/tmp}:rw"
    command: ["python3", "-m", "my_curator.cli.run_curation_consumer", "--timeout", "0"]
    networks:
      - curation-net

networks:
  curation-net:
    external: true
    name: my-curator-base_curation-net
