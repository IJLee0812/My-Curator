name: Auto assign & label

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      # For PRs: assign the PR author; also request review from CODEOWNERS (handled by GitHub).
      - name: Assign PR author as assignee
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const assignee = pr.user && pr.user.login;
            if (!assignee) return;
            try {
              await github.rest.issues.addAssignees({
                owner, repo, issue_number: pr.number, assignees: [assignee]
              });
            } catch (e) { core.warning(`assign failed: ${e.message}`); }

      # For issues opened without an assignee (e.g. via API), fall back to the repo owner.
      - name: Ensure issue has an assignee
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            if (issue.assignees && issue.assignees.length > 0) return;
            try {
              await github.rest.issues.addAssignees({
                owner, repo, issue_number: issue.number, assignees: ['IJLee0812']
              });
            } catch (e) { core.warning(`assign failed: ${e.message}`); }

      # Auto-apply phase/area labels based on PR title prefix like "[P2-3]".
      - name: Derive phase label from PR title
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const m = /\[P(\d)-\d+\]/.exec(pr.title || '');
            if (!m) return;
            const label = `phase/${m[1]}`;
            try {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pr.number, labels: [label]
              });
            } catch (e) { core.warning(`label failed: ${e.message}`); }
