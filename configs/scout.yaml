# Scout sampling configuration
# temperatures: diversity order — T[0] is computed by nvvllmvlm (DS pipeline);
#   T[1..] are batch-generated by CosmosReasonScout directly.
# n: set to 1 to activate single-call fallback (resource-safety mode).
# seeds: fixed per temperature for reproducibility.

temperatures: [0.3, 0.5, 0.7]
seeds:
  0.3: 42
  0.5: 43
  0.7: 44
n: 1
max_tokens: 1024
top_p: 0.9
top_k: 50
repetition_penalty: 1.1

engine:
  # gstnvvllmvlm_api: in-process vllm.LLM injected from NvVllmVLM element (P2-4).
  # Spike (2026-04-29): no OpenAI-compat HTTP endpoint exposed — this is the only option.
  backend: gstnvvllmvlm_api
  base_url: ""
  model: cosmos-reason2-8b
  timeout_s: 30

kafka:
  # Curation routing topics (P2-4).
  # scouted   : clip passed Best-of-N grounding check → downstream DNA pipeline.
  # needs_review: partial batch failure OR zero YOLO grounding → manual review queue.
  topic_scouted: "curation.clip.scouted"
  topic_needs_review: "curation.clip.needs_review"
